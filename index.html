<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Parallax Particle Background</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(135deg, #fdfdfd, #f0f0f0, #ffffff);
      background-size: 400% 400%;
      animation: gradientShift 20s ease infinite;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
    }

    #bgLayer { z-index: 0; }
    #fgLayer { z-index: 1; }
    #orbitLayer { z-index: 2; }
    #snakeLayer { z-index: 3; }
    #cometLayer { z-index: 4; }
  </style>
</head>
<body>
  <canvas id="bgLayer"></canvas>
  <canvas id="fgLayer"></canvas>
  <canvas id="orbitLayer"></canvas>
  <canvas id="snakeLayer"></canvas>
  <canvas id="cometLayer"></canvas>

  <script>
    const bgCanvas = document.getElementById('bgLayer');
    const fgCanvas = document.getElementById('fgLayer');
    const orbitCanvas = document.getElementById('orbitLayer');
    const snakeCanvas = document.getElementById('snakeLayer');
    const cometCanvas = document.getElementById('cometLayer');

    const bgCtx = bgCanvas.getContext('2d');
    const fgCtx = fgCanvas.getContext('2d');
    const orbitCtx = orbitCanvas.getContext('2d');
    const snakeCtx = snakeCanvas.getContext('2d');
    const cometCtx = cometCanvas.getContext('2d');

    let bgParticles = [], fgParticles = [], orbiters = [], snakes = [], comets = [];

    const snakeColors = [
      '#FF6B6B', // Red
      '#6BCB77', // Green
      '#4D96FF', // Blue
      '#FFD93D', // Yellow
      '#845EC2', // Purple
      '#F9A826', // Orange
      '#00C9A7', // Teal
      '#F08080'  // Light Red
    ];

    function resizeCanvas() {
      [bgCanvas, fgCanvas, orbitCanvas, snakeCanvas, cometCanvas].forEach(c => {
        c.width = window.innerWidth;
        c.height = window.innerHeight;
      });
    }

    window.addEventListener('resize', () => {
      resizeCanvas();
      initParticles();
      initOrbiters();
    });

    class Particle {
      constructor(layer) {
        this.layer = layer;
        this.reset();
      }

      reset() {
        this.x = Math.random() * window.innerWidth;
        this.y = Math.random() * window.innerHeight;
        this.radius = Math.random() * 2 + 1;
        this.speedX = (Math.random() - 0.5) * 0.5;
        this.speedY = (Math.random() - 0.5) * 0.5;
        this.opacity = Math.random() * 0.5 + 0.2;
      }

      update() {
        this.x += this.speedX;
        this.y += this.speedY;

        if (this.x < 0 || this.x > window.innerWidth || this.y < 0 || this.y > window.innerHeight) {
          this.reset();
        }
      }

      draw() {
        const ctx = this.layer === 'bg' ? bgCtx : fgCtx;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(200, 200, 255, ${this.opacity})`;
        ctx.fill();
      }
    }

    class Orbiter {
      constructor() {
        this.centerX = Math.random() * orbitCanvas.width;
        this.centerY = Math.random() * orbitCanvas.height;
        this.radius = Math.random() * 40 + 30;
        this.angle = Math.random() * Math.PI * 2;
        this.speed = 0.01 + Math.random() * 0.01;
        this.size = Math.random() * 2 + 1;
        this.opacity = 0.3 + Math.random() * 0.4;
      }

      update() {
        this.angle += this.speed;
      }

      draw(ctx) {
        const x = this.centerX + Math.cos(this.angle) * this.radius;
        const y = this.centerY + Math.sin(this.angle) * this.radius;

        ctx.beginPath();
        ctx.arc(x, y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 150, 150, ${this.opacity})`;
        ctx.shadowColor = `rgba(255, 100, 100, ${this.opacity})`;
        ctx.shadowBlur = 6;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    function initParticles() {
      bgParticles = [], fgParticles = [];
      for (let i = 0; i < 60; i++) bgParticles.push(new Particle('bg'));
      for (let i = 0; i < 100; i++) fgParticles.push(new Particle('fg'));
    }

    function initOrbiters() {
      orbiters = [];
      for (let i = 0; i < 30; i++) orbiters.push(new Orbiter());
    }

    function updateSnakes() {
      if (snakes.length === 0) {
        for (let i = 0; i < snakeColors.length; i++) {
          const angle = (i / snakeColors.length) * Math.PI * 2;
          const radius = 100 + Math.random() * 100;
          const x = snakeCanvas.width / 2 + Math.cos(angle) * radius + Math.random() * 20;
          const y = snakeCanvas.height / 2 + Math.sin(angle) * radius + Math.random() * 20;
          snakes.push({
            body: [{ x, y }],
            color: snakeColors[i % snakeColors.length],
            target: null
          });
        }
      }

      snakes.forEach((snake, index) => {
        const head = snake.body[0];
        let closest = null;
        let closestDist = Infinity;

        fgParticles.forEach(p => {
          const dx = head.x - p.x;
          const dy = head.y - p.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < closestDist) {
            closestDist = dist;
            closest = p;
          }
        });

        if (closest && closestDist < 10) {
          fgParticles.splice(fgParticles.indexOf(closest), 1);
        } else if (closest) {
          const dx = closest.x - head.x;
          const dy = closest.y - head.y;
          const step = 0.5;
          const angle = Math.atan2(dy, dx);
          const newX = head.x + Math.cos(angle) * step;
          const newY = head.y + Math.sin(angle) * step;

          let overlap = snakes.some((other, i) => {
            if (i === index) return false;
            return other.body.some(segment => {
              const d = Math.hypot(segment.x - newX, segment.y - newY);
              return d < 8;
            });
          });

          if (!overlap) {
            snake.body.unshift({ x: newX, y: newY });
            if (snake.body.length > 100) snake.body.pop();
          }
        }
      });
    }

    function drawSnakes() {
      snakeCtx.clearRect(0, 0, snakeCanvas.width, snakeCanvas.height);
      snakes.forEach(snake => {
        for (let i = 0; i < snake.body.length; i++) {
          const s = snake.body[i];
          snakeCtx.beginPath();
          snakeCtx.arc(s.x, s.y, 4, 0, Math.PI * 2);
          snakeCtx.fillStyle = `${snake.color}`;
          snakeCtx.globalAlpha = 1 - i / snake.body.length;
          snakeCtx.fill();
        }
      });
      snakeCtx.globalAlpha = 1;
    }

    function respawnFgParticles() {
      const targetCount = 100;
      const currentCount = fgParticles.length;
      for (let i = 0; i < targetCount - currentCount; i++) {
        fgParticles.push(new Particle('fg'));
      }
    }

    function animateParticles() {
      bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
      fgCtx.clearRect(0, 0, fgCanvas.width, fgCanvas.height);
      orbitCtx.clearRect(0, 0, orbitCanvas.width, orbitCanvas.height);

      bgParticles.forEach(p => { p.update(); p.draw(); });
      fgParticles.forEach(p => { p.update(); p.draw(); });
      orbiters.forEach(o => { o.update(); o.draw(orbitCtx); });

      updateSnakes();
      drawSnakes();
      respawnFgParticles();

      requestAnimationFrame(animateParticles);
    }

    resizeCanvas();
    initParticles();
    initOrbiters();
    animateParticles();
  </script>
</body>
</html>
